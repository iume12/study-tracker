<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d12">
<meta name="author" content="Amira">
<meta name="description" content="Study Tracker · Designed by Amira">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Study Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: one-column phone app on a cool grey ground; white lists, blue only for what's due or done; subjects carry their own colour and icon; fixed bottom tabs + bottom sheets */
:root{
  --bg:#0b0d12; --surface:#151820; --surface-2:#1d212b; --line:#272c38;
  --fg:#eef1f6; --muted:#8f97a8;
  --accent:#3d6fe8; --accent-2:#1d43a8; --accent-soft:#16233b; --on-accent:#ffffff;
  --warn:#3d6fe8; --warn-soft:#16233b; --ok:#3d6fe8;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --body:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px;
  color-scheme:dark;
}
/* one night theme on purpose: deep navy ground, blue light for what matters, the same in light and dark mode */
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
#main{display:flex;flex-direction:column;gap:24px}
.tnum{font-variant-numeric:tabular-nums}
@keyframes fade{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
.anim{animation:fade .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.anim,.sheet-panel{animation:none!important}*{transition:none!important}}

h1,h2{font-family:var(--display);font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:32px;line-height:1.08}
h2{font-size:20px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-weight:500}
.label{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.label span{letter-spacing:.01em;text-transform:none;font-weight:600}
.head{display:flex;align-items:flex-end;gap:12px}
.head>div{flex:1;min-width:0}
.blockchip{flex:none;height:32px;padding:0 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.empty{color:var(--muted);font-size:14px;padding:4px 2px}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:0}

/* exam countdown cards */
.exams{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.exam{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.exam .en{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.exam .ed{font-family:var(--display);font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.exam .ed small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:4px}
.exam .ew{font-size:12px;color:var(--muted);font-weight:600}
.exam.soon{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.exam.soon .ed{color:var(--accent)}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.meter b{display:block;height:100%;border-radius:99px;background:var(--accent)}
.exam .ep{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-top:4px}

/* warning */
.warn{background:var(--warn-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;color:var(--fg)}
.warn strong{color:var(--warn)}
.warn details summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--warn)}
.warn ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}

/* tasks */
.tasks{display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tick{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--on-accent);transition:background .18s,border-color .18s,transform .12s}
.tick:active{transform:scale(.88)}
.tick svg{width:15px;height:15px;opacity:0}
.task.done .tick{background:var(--accent);border-color:var(--accent)}
.task.done .tick svg{opacity:1}
.task.done .tt{color:var(--muted);text-decoration:line-through}
.tb{flex:1;min-width:0}
.tt{font-weight:600;overflow-wrap:anywhere}
.tm{font-size:12px;color:var(--muted);font-weight:600;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:2px}
.code{font-size:11px;font-weight:800;letter-spacing:.02em;padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--fg);margin-right:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stg{font-weight:700;color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.mins{flex:none;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.online{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 4px}

/* classes */
.classes{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cls{display:flex;gap:12px;align-items:baseline;padding:10px 14px;border-top:1px solid var(--line)}
.cls:first-child{border-top:0}
.cls .ct{flex:none;width:52px;white-space:nowrap;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.cls .cb{flex:1;min-width:0;overflow-wrap:anywhere}
.cls.ev .cb{color:var(--muted)}

/* next days */
.next{display:flex;flex-direction:column;gap:6px}
.nd{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.nd .ndd{width:76px;flex:none;font-weight:700}
.nd .ndd small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.nd .ndb{flex:1;min-width:0;font-size:13px;color:var(--muted);font-weight:600}
.loadbar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.loadbar b{display:block;height:100%;background:var(--accent-2)}

/* plan agenda */
.day{display:flex;flex-direction:column;gap:8px}
.dayh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dayh h2{font-size:18px}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.free{background:var(--accent-soft);color:var(--accent)}
.pill.today{background:var(--accent);color:var(--on-accent)}
.dayt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:4px 0}
.dayt .dayh{flex:1;min-width:0}
.dayt .chev{color:var(--muted);flex:none;transition:transform .15s}
.dayt .chev svg{width:16px;height:16px;display:block}
.dayt .chev.open{transform:rotate(90deg)}
.dayh .cap{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted)}
.examrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:700}
.examrow span{margin-left:auto;font-weight:600;opacity:.85}

/* filters */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg button{height:36px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px color-mix(in srgb,var(--fg) 14%,transparent)}

/* lecture list */
.subj{display:flex;flex-direction:column;gap:6px}
.subjh{display:flex;align-items:center;gap:8px;font-weight:700}
.subjh .sp{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lec{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.lec-top{display:flex;gap:8px;align-items:flex-start;text-align:left;width:100%}
.lec-top .tb{flex:1}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.sp4{height:32px;border-radius:9px;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:4px;transition:background .15s,color .15s,transform .1s}
.sp4:active{transform:scale(.94)}
.sp4.on{background:var(--accent);color:var(--on-accent)}
.sp4 svg{width:12px;height:12px}
.lec.future{opacity:.62}
.bulk{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}

/* progress */
.hero{display:flex;align-items:center;gap:16px}
.hero .num{font-family:var(--display);font-size:52px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.hero .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.bar-row .n{font-weight:600;min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px}
.bar-row .v{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track b{display:block;height:100%;border-radius:99px;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;font-weight:600;color:var(--muted)}
.stat.alert b{color:var(--warn)}

/* block settings */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rowb{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.rowb:first-child{border-top:0}
.rowb .rb{flex:1;min-width:0}
.rowb .rb small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.rowb .chev{color:var(--muted);flex:none}
.rowb .chev svg{width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea,.inp{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-weight:600;color:var(--fg);width:100%;min-width:0}
.field textarea{height:auto;min-height:140px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stepper .sl{font-weight:600}
.stepper .sl small{display:block;color:var(--muted);font-size:12px}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:36px;height:36px;border-radius:10px;background:var(--surface-2);font-weight:800;font-size:18px}
.stp output{min-width:58px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.btn{height:46px;border-radius:12px;padding:0 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.dark{background:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line))}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.btns.col{flex-direction:column}
.btns.col .btn{flex:none;width:100%}
.sheet-panel>*{flex-shrink:0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.sw{flex:none;width:50px;height:30px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);position:relative;transition:background .18s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px color-mix(in srgb,var(--fg) 30%,transparent);transition:transform .18s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on::after{transform:translateX(20px)}
.msg{font-size:13px;font-weight:600;color:var(--fg);background:var(--accent-soft);padding:8px 12px;border-radius:10px}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--warn-soft);border-radius:12px;padding:12px;font-weight:600}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(16,24,40,.38)}
.sheet-panel{width:100%;max-width:600px;max-height:90%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .24s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 0}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{flex:1;min-width:0}
.x{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.x svg{width:16px;height:16px}
.plist{max-height:260px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:13px}
.plist div{display:flex;gap:8px;padding:6px 10px;border-top:1px solid var(--line)}
.plist div:first-child{border-top:0}
.plist .pd{flex:none;width:86px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
.tabs{background:rgba(255,255,255,.94)}
.iconbtn{border-color:var(--line);color:var(--accent)}
.label{color:var(--accent)}
h1{color:var(--fg)}
.list{border-color:var(--line);box-shadow:0 2px 10px -6px rgba(236,79,145,.25)}
.tick{border-color:var(--accent-2)}
.toast{background:var(--accent);color:#fff}

/* v2: calmer lists */
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.list>*{border-top:1px solid var(--line)}
.list>*:first-child{border-top:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:60px}
.row .tick{flex:none}
.row.done .tick{background:var(--accent);border-color:var(--accent)}
.row.done .tick svg{opacity:1}
.row.done .tt{color:var(--muted);text-decoration:line-through}
.row.later{opacity:.55}
.rowtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.rowtext .tt{font-weight:600;line-height:1.3}
.rowtext .tm{font-size:13px;color:var(--muted);font-weight:500;margin:0}
.ringbtn{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;transition:transform .12s}
.ringbtn:active{transform:scale(.88)}
.iconbtn{flex:none;width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--fg)}
.iconbtn svg{width:20px;height:20px}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--accent);height:36px}
.back svg{width:18px;height:18px}
.link{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--accent);margin-top:12px;font-size:14px}
.link svg{width:14px;height:14px}
.hero-card{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;padding:20px;border-radius:22px;background:linear-gradient(135deg,#f0609e 0%,#f78fbb 60%,#fbb3d0 100%);color:#fff;box-shadow:0 10px 24px -12px rgba(236,79,145,.55)}
.hc-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:#fff;opacity:.95;flex-wrap:wrap}
.hc-num{font-family:var(--display);font-size:46px;font-weight:600;letter-spacing:-.03em;line-height:1;color:#fff}
.hc-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden;margin-top:6px}
.hc-bar b{display:block;height:100%;min-width:8px;border-radius:99px;background:#fff}
.hc-foot{font-size:13px;font-weight:600;color:#fff;opacity:.92}
.behind{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:12px 14px;border-radius:14px;background:var(--warn-soft);font-size:14px;line-height:1.4}
.behind strong{color:var(--warn)}
.behind .chev{color:var(--warn);flex:none}.behind .chev svg{width:16px;height:16px}
.hint{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:500;padding:4px 0}
.hint span{flex:1}
.exrow{display:flex;align-items:center;gap:14px;padding:14px;text-align:left;width:100%}
.exrow.later{opacity:.6}
.exrow .chev,.row .chev{color:var(--muted);flex:none}.exrow .chev svg{width:16px;height:16px}
.dayt .dn{font-weight:700;font-size:16px;flex:1}
.dayt .ds{font-size:13px;font-weight:600;color:var(--muted)}
.day{gap:8px}
.examrow{padding:10px 14px;border-radius:12px;font-size:14px}
.cls{padding:10px 14px}

/* v3: white, grey and blue */
body{background:var(--bg)}
.tabs{background:rgba(255,255,255,.95)}

.tick{border-color:#c9d1dc}

@keyframes grow{from{width:0}}
.anim .daybar b,.anim .cbar b,.anim .sbar b,.anim .track b,.anim .qprog b{animation:grow .7s cubic-bezier(.2,.8,.2,1)}

/* header extras */

/* counters */
.counters{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.counter{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left}

.counter.first{background:var(--accent);border-color:var(--accent);color:#fff}

.cheer{display:flex;align-items:center;gap:8px;margin-top:10px;padding:12px 14px;border-radius:14px;background:#fff7e0;color:#5c4300;font-weight:700;animation:pop .4s ease-out}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.behind{background:#fff4e5}
.behind strong{color:#b45309}
.behind .chev{color:#b45309}

/* subject badges */
.badge{flex:none;display:grid;place-items:center;border-radius:12px}

.subj{display:flex;flex-direction:column;gap:8px}

.subjh .sh .tm{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.spct{font-family:var(--display);font-weight:600;font-size:20px}
.sbar{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.sbar b{display:block;height:100%;border-radius:99px}
.row.complete .tt{color:var(--fg)}
.donestar{display:grid;place-items:center;width:40px;height:40px;animation:pop .45s ease-out}
.cls{display:flex;align-items:center;gap:10px}
.cls .cb{display:flex;flex-direction:column;min-width:0}
.cls .ctt{font-weight:600}
.cls .tm{font-size:12px;color:var(--muted);font-weight:500}
.qtag{color:#b07d00;font-weight:800}

/* calendar */
.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:-8px}
.calnav strong{font-family:var(--display);font-size:20px;font-weight:600}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}

.cc{position:relative;aspect-ratio:1/1.12;max-width:100%;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:4px;min-width:0}
.cc.blank{visibility:hidden}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;font-weight:600;color:var(--muted)}

/* exams */
.ringwrap{position:relative;display:inline-grid;place-items:center;flex:none}
.ringpct{position:absolute;font-size:12px;font-weight:800}
.exrow .rowtext .tm{display:flex;align-items:center;gap:4px}

/* quizzes */
.bankrow{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.stars{display:inline-flex;gap:1px;flex:none}

.qtop{display:flex;align-items:center;gap:12px}
.qprog{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.qprog b{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.qcount{font-weight:700;color:var(--muted);font-size:13px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px}
.qtext{font-size:17px;font-weight:600;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);text-align:left;width:100%;transition:transform .1s,border-color .15s,background .15s}
.opt:active{transform:scale(.98)}
.opt .ol{flex:none;width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted)}
.opt .ot{flex:1;min-width:0;font-weight:600}
.opt .oi{flex:none;width:22px;height:22px}
.opt .oi svg{width:22px;height:22px}
.opt.good{border-color:#1a9c5b;background:#ecfaf2}

.opt.good .oi{color:#1a9c5b;animation:pop .35s ease-out}
.opt.bad{border-color:#d93f3f;background:#fdf0f0;animation:shake .35s}

.opt.bad .oi{color:#d93f3f}
.opt.pickedn{border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default;color:inherit}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

.feedback.bad{background:#fdf0f0;color:#9b2c2c}

.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px 0}
.result .num{font-family:var(--display);font-size:56px;font-weight:600;letter-spacing:-.03em;line-height:1}
.bigstars{display:flex;gap:6px;margin-bottom:8px}

@keyframes starpop{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.cheerline{font-weight:700;font-size:16px;margin:4px 0 0}

<script>
/* ==== timetable parser (shared with app) ==== */
function parseTimetable(pages){
  const out={name:"",items:[],events:[],exams:[],free:[],warnings:[],range:null};
  const sessions=[],defsByRegion=[],defsAll={};
  const DATE_RE=/^(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{2,4})$/;
  const pad=n=>String(n).padStart(2,"0");
  const toISO=(d,m,y)=>{y=Number(y);if(y<100)y+=2000;return `${y}-${pad(m)}-${pad(d)}`};
  const ck=s=>s.replace(/\s+/g,"").toUpperCase();
  const codeKey=(t,n)=>{t=t.toUpperCase();return (t==="LAB"?"LAB":t)+Number(n)};
  const median=a=>{if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);return b[Math.floor(b.length/2)]};
  const groupLines=(its,tol)=>{
    const s=[...its].sort((a,b)=>a.y-b.y||a.x-b.x),lines=[];
    for(const it of s){const l=lines[lines.length-1];if(l&&Math.abs(it.y-l.y)<=tol){l.items.push(it)}else lines.push({y:it.y,items:[it]})}
    lines.forEach(l=>l.items.sort((a,b)=>a.x-b.x));return lines;
  };
  let allText="";
  pages.forEach((pg,pi)=>{
    const raw=pg.items.filter(i=>i.str&&i.str.trim()).map(i=>({...i,str:i.str.replace(/\s+/g," ").trim()}));
    /* merge character fragments into runs */
    const items=[];
    for(const ln of groupLines(raw,1.5)){
      let cur=null;
      for(const it of ln.items){
        const gap=cur?it.x-(cur.x+cur.w):99;
        if(cur&&gap<4.5){cur.str+=(gap<1.2?"":" ")+it.str;cur.w=Math.max(cur.w,it.x+it.w-cur.x)}
        else{cur={...it};items.push(cur)}
      }
    }
    allText+=" "+items.map(i=>i.str).join(" ");
    const dates=items.filter(i=>DATE_RE.test(i.str));
    const dateRows=groupLines(dates,4).filter(l=>l.items.length>=3);
    dateRows.forEach((dr,ri)=>{
      const top=dr.y-30,bottom=ri+1<dateRows.length?dateRows[ri+1].y-60:Infinity;
      const cols=dr.items.map(i=>{const m=i.str.match(DATE_RE);return {cx:i.x+i.w/2,date:toISO(m[1],m[2],m[3])}});
      const firstCx=cols[0].cx;
      const reg=items.filter(i=>i.y>top&&i.y<bottom);
      const timeItems=reg.filter(i=>/^\d{1,2}:\d{2}\s*[–-]/.test(i.str)&&i.x+i.w/2<firstCx-25);
      const times=groupLines(timeItems,3).map(l=>{const m=l.items[0].str.match(/^(\d{1,2}):(\d{2})/);let h=Number(m[1]);if(h<7)h+=12;return {y:l.y,time:`${pad(h)}:${m[2]}`,right:Math.max(...l.items.map(i=>i.x+i.w))}});
      if(!times.length){out.warnings.push(`Page ${pi+1}: found dates but no time rows.`);return}
      const gap=median(times.slice(1).map((t,i)=>t.y-times[i].y))||14;
      const gTop=times[0].y-gap*0.75,gBot=times[times.length-1].y+gap*0.75;
      const leftEdge=Math.max(...times.map(t=>t.right));
      const cells={};
      for(const it of reg){
        if(it.y<gTop||it.y>gBot||it.x<leftEdge-2)continue;
        if(DATE_RE.test(it.str)||/^\d{1,2}:\d{2}\s*[–-]/.test(it.str))continue;
        if(/prayer/i.test(it.str))continue;
        const cx=it.x+it.w/2;
        let ci=0;cols.forEach((c,k)=>{if(Math.abs(c.cx-cx)<Math.abs(cols[ci].cx-cx))ci=k});
        let ti=0;times.forEach((t,k)=>{if(Math.abs(t.y-it.y)<Math.abs(times[ti].y-it.y))ti=k});
        const key=ci+":"+ti;(cells[key]=cells[key]||[]).push(it);
      }
      cols.forEach((c,ci)=>{
        const frags=[];
        times.forEach((t,ti)=>{
          const its=cells[ci+":"+ti];if(!its)return;
          its.sort((a,b)=>a.y-b.y||a.x-b.x);
          const raw=its.map(i=>i.str).join(" ");
          const online=/online/i.test(raw);
          const clean=raw.replace(/[()]/g," ").replace(/\b(online|girls|boys|male|female|g|b)\b/gi," ").replace(/\s+/g," ").trim();
          let rest=clean;const re=/\b(L|PI|TBL|LAB)\s*(\d{1,2})\b/gi;let m;
          while((m=re.exec(clean))){sessions.push({key:codeKey(m[1],m[2]),date:c.date,time:t.time,online,region:pi+":"+ri});rest=rest.replace(m[0]," ")}
          rest=rest.replace(/\s+/g," ").trim();
          if(rest&&!/^(lab|lec|lecture)$/i.test(rest))frags.push({ti,text:rest,time:t.time});
        });
        /* merge label fragments */
        const KNOWN=/^(ICM\s*\d*|UA|SDL|OSPE|OSCE|PBL\s*\d*|CBL\s*\d*)$/i;
        const labels=[];
        for(const f of frags){
          const last=labels[labels.length-1];
          if(last&&!KNOWN.test(f.text)&&!KNOWN.test(last.text)&&f.ti-last.ti2<=2){last.text+=" "+f.text;last.ti2=f.ti}
          else labels.push({text:f.text,time:f.time,ti2:f.ti});
        }
        for(const l of labels){
          const t=l.text.replace(/\s+/g," ").trim();
          if(/study\s*day|exam\s*prep|extended\s*weekend|holiday|vacation|day\s*off|reading\s*week/i.test(t)){out.free.push(c.date);out.events.push({date:c.date,time:l.time,label:t,free:true})}
          else if(/mid\s*-?\s*(term|exam)|midexam/i.test(t)){out.exams.push({kind:"midterm",name:"Midterm",date:c.date,time:l.time,label:t})}
          else if(/^(OSPE|OSCE)$/i.test(t)){out.exams.push({kind:"practical",name:t.toUpperCase(),date:c.date,time:l.time,label:t})}
          else out.events.push({date:c.date,time:l.time,label:t});
        }
      });
      /* abbreviation table below the grid */
      const tbl=reg.filter(i=>i.y>gBot+4);
      const hx=re=>{const h=tbl.find(i=>re.test(i.str));return h?h.x:null};
      const titleX=hx(/^Explanation/i),discX=hx(/^Discipline/i),maleX=hx(/^(Male|Faculty|Lecturer|Instructor)/i);
      if(titleX==null||discX==null){return}
      const colOf=i=>i.x<titleX-3?"code":i.x<discX-15?"title":(maleX==null||i.x<maleX-15)?"disc":"fac";
      const lines=groupLines(tbl,3).map(l=>{
        const by={code:[],title:[],disc:[],fac:[]};l.items.forEach(i=>by[colOf(i)].push(i.str));
        const header=l.items.some(i=>/abbreviation|explanation|used in the|table above|^above$|discipline|faculty/i.test(i.str));
        const cm=ck(by.code.join("")).match(/^(L|PI|TBL|LAB)(\d{1,2})$/);
        return {y:l.y,header,code:cm?codeKey(cm[1],cm[2]):null,codeText:by.code.join(" "),title:by.title.join(" ").trim(),disc:by.disc.join(" ").trim(),claimed:false};
      });
      const lg=median(lines.slice(1).map((l,i)=>l.y-lines[i].y))||12;
      const near=(a,b)=>Math.abs(a.y-b.y)<=lg*1.7;
      const free=l=>l&&!l.header&&!l.code&&!l.claimed&&!l.codeText;
      const anchors=lines.filter(l=>l.code);
      lines.forEach((l,i)=>{if(!l.code||l.title)return;
        const parts=[];const up=lines[i-1],dn=lines[i+1];
        if(free(up)&&up.title&&near(up,l)){parts.push(up);up.claimed=true}
        if(free(dn)&&dn.title&&near(dn,l)&&!(lines[i+2]&&lines[i+2].code&&!lines[i+2].title)){parts.push(dn);dn.claimed=true}
        l.title=parts.map(p=>p.title).join(" ").trim();
        if(!l.disc)l.disc=parts.map(p=>p.disc).filter(Boolean).join(" ");
      });
      lines.forEach((l,i)=>{if(!l.code)return;
        for(let j=i+1;j<lines.length;j++){const n=lines[j];if(!free(n)||!n.title||n.disc||!near(n,lines[j-1]))break;l.title+=" "+n.title;n.claimed=true}
      });
      const defs={};
      anchors.forEach(a=>{const d={title:a.title.replace(/\s+/g," ").trim(),disc:a.disc};defs[a.code]=d;defsAll[a.code]=defsAll[a.code]||d});
      defsByRegion[pi+":"+ri]=defs;
    });
  });
  /* name + final exam from free text */
  const fm=allText.match(/([A-Za-z&]+)\s+(?:SYSTEM\s+|COURSE\s+|BLOCK\s+)?FINAL\s+EXAM\w*\s*[:\-]?\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{2,4})/i);
  if(fm){out.exams.push({kind:"final",name:"Final",date:toISO(fm[2],fm[3],fm[4]),time:"",label:fm[0]});out.name=fm[1]}
  if(!out.name){const nm=allText.match(/([A-Za-z&]+)\s+(?:SYSTEM\s+)?(?:COURSE|BLOCK)\b/i);if(nm)out.name=nm[1]}
  if(!out.name){const mm=out.exams.find(e=>e.kind==="midterm");if(mm){const w=mm.label.split(/\s+/)[0];if(!/mid/i.test(w))out.name=w}}
  out.name=out.name?out.name[0].toUpperCase()+out.name.slice(1).toLowerCase():"";
  /* build items */
  const SUBJ=[["PHYSIO","Physiology"],["ANAT","Anatomy"],["HISTO","Histology"],["BIOCH","Biochemistry"],["PATHO","Pathology"],["MICRO","Microbiology"],["PHARM","Pharmacology"],["RADIO","Radiology"],["IMMUN","Immunology"],["GENET","Genetics"],["PARAS","Parasitology"],["COMMUN","Community Medicine"],["FAMIL","Family Medicine"],["MEDIC","Medicine"],["SURG","Surgery"],["EMBRY","Embryology"],["NEURO","Neuroscience"]];
  const subjOf=d=>{const u=(d||"").toUpperCase().replace(/[^A-Z]/g,"");for(const[k,v]of SUBJ)if(u.includes(k))return v;const w=(d||"").trim().split(/\s+/)[0]||"";return w?w[0].toUpperCase()+w.slice(1).toLowerCase():"Other"};
  const titleCase=t=>t.toLowerCase().replace(/\b([a-z])/g,(m,c)=>c.toUpperCase()).replace(/\b(And|Of|The|In|For|To|With|On|At)\b/g,w=>w.toLowerCase()).replace(/^./,c=>c.toUpperCase());
  const seen=new Set();
  for(const s of sessions){
    const d=(defsByRegion[s.region]||{})[s.key]||defsAll[s.key];
    const id=s.key+"|"+s.date;if(seen.has(id))continue;seen.add(id);
    const m=s.key.match(/^(L|PI|TBL|LAB)(\d+)$/);
    const type=m[1]==="LAB"?"Lab":m[1];
    const code=type==="L"?"L"+m[2]:type==="PI"?"PI"+m[2]:type==="TBL"?"TBL "+m[2]:"Lab "+m[2];
    let title=d?d.title:"";let online=s.online;
    if(/\(\s*online\s*\)/i.test(title)){online=true;title=title.replace(/\(\s*online\s*\)/ig,"").trim()}
    if(title&&title===title.toUpperCase()&&title.replace(/[^A-Z]/g,"").length>5)title=titleCase(title);
    if(title)title=(title[0].toUpperCase()+title.slice(1)).replace(/([a-z])(\d+)$/,"$1 $2");
    if(!d)out.warnings.push(`${code} on ${s.date} has no title in the file.`);
    out.items.push({code,type,title:title||code,subject:d?subjOf(d.disc):"Other",date:s.date,time:s.time,online});
  }
  out.items.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  out.events.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const ds=[...out.items.map(i=>i.date),...out.events.map(e=>e.date)].sort();
  if(ds.length)out.range=[ds[0],ds[ds.length-1]];
  /* de-dup exams by kind */
  const ex={};out.exams.forEach(e=>{const k=e.kind+"|"+e.name;if(!ex[k])ex[k]=e});out.exams=Object.values(ex);
  return out;
}
if(typeof module!=="undefined")module.exports={parseTimetable};

</script>

const dt=(d,t)=>d+"T"+(t||"00:00");
function examMembers(blk,ex){
  const set=new Set();const exT=dt(ex.date,ex.time||"23:59");
  const after=ex.mode==="after"&&ex.after?blk.exams.find(e=>e.id===ex.after):null;
  const afT=after?dt(after.date,after.time||"00:00"):null;
  for(const it of blk.items){
    if(it.type==="PI"||it.type==="TBL")continue;
    let inc=false;
    if(ex.mode!=="pick"&&ex.types.includes(it.type)){
      const t=dt(it.date,it.time);
      inc=t<exT&&(!afT||t>afT);
    }
    if(ex.add.includes(it.id))inc=true;
    if(ex.remove.includes(it.id))inc=false;
    if(inc)set.add(it.id);
  }
  return set;
}
let memoKey="",memoVal=null;
function members(blk){
  const k=JSON.stringify([blk.id,blk.items.length,blk.exams,blk.items.map(i=>i.id+i.date+i.time+i.type)]);
  if(k===memoKey)return memoVal;
  const m={};blk.exams.forEach(e=>m[e.id]=examMembers(blk,e));memoKey=k;memoVal=m;return m;
}
const prog=(blk,id)=>blk.progress[id]||{};
const doneCount=(blk,id)=>STAGES.filter(s=>prog(blk,id)[s]).length;
function weightOf(blk,ex,it,mem){
  if(ex.q&&ex.q[it.id])return +ex.q[it.id];
  if(ex.subj&&ex.subj[it.subject]){const n=[...mem].filter(id=>{const x=blk.items.find(i=>i.id===id);return x&&x.subject===it.subject}).length||1;return ex.subj[it.subject]/n}
  return 1;
}
function examStats(blk,ex){
  const mem=members(blk)[ex.id];const its=blk.items.filter(i=>mem.has(i.id));const t=today();
  let w=0,wd=0,steps=0;const st={s1:0,s2:0,s3:0,s4:0};let behind=0,full=0;const weighted=Object.keys(ex.subj||{}).length>0||Object.keys(ex.q||{}).length>0;
  for(const it of its){const p=prog(blk,it.id);const c=doneCount(blk,it.id);steps+=c;STAGES.forEach(s=>{if(p[s])st[s]++});
    const ww=weightOf(blk,ex,it,mem);w+=ww;wd+=ww*c/4;if(it.date<=t&&!p.s1)behind++;if(c===4)full++}
  return {n:its.length,items:its,steps,total:its.length*4,pct:its.length?wd/w:0,st,behind,full,weighted};
}
function durOf(){return 1}

/* ---------- planner ---------- */
let planMemo={k:"",v:null};
function buildPlan(blk){
  const t=today();
  const key=JSON.stringify([t,blk.id,blk.items,blk.exams,blk.progress,blk.free,S.settings]);
  if(planMemo.k===key)return planMemo.v;
  const exams=blk.exams.filter(e=>e.date>t).sort((a,b)=>a.date.localeCompare(b.date));
  const res={days:[],overflow:{},exams};
  if(!exams.length){planMemo={k:key,v:res};return res}
  const mem=members(blk);
  const st=[];
  for(const it of blk.items){
    const ex=exams.find(e=>mem[e.id].has(it.id));if(!ex)continue;
    const p=prog(blk,it.id);
    const next=STAGES.findIndex(s=>!p[s]);if(next<0)continue;
    const doneDates=STAGES.map(s=>p[s]).filter(Boolean).sort();
    const last=doneDates.length?doneDates[doneDates.length-1]:null;
    const lastDay=addDays(ex.date,-1);
    const s={it,ex,next,lastDay,w:weightOf(blk,ex,it,mem),earliest:null};
    s.earliest=earliestFor(s,last,t);
    st.push(s);
  }
  /* spacing: 1 day to summary, 4 more to second study, review in the last 3 days; squeezed when time is short */
  function earliestFor(s,prevDay,t){
    const NG=[0,1,4,1];
    let e;
    if(s.next===0)e=s.it.date>t?s.it.date:t;
    else{
      const from=prevDay&&prevDay>t?prevDay:(prevDay||t);
      let rem=0;for(let k=s.next;k<4;k++)rem+=NG[k];
      const span=Math.max(0,diffDays(from<t?t:from,s.lastDay));
      const f=Math.min(1,span/rem);
      e=addDays(from,Math.round(NG[s.next]*f));
      /* finish summary and second study before the review window so reviews don't pile up at the end */
      if(s.next<3){const cap=addDays(s.ex.date,-(6-s.next));const c=cap>from?cap:from;if(e>c)e=c}
      if(e<t)e=t;if(s.it.date>e)e=s.it.date;
    }
    if(s.next===3){const w=addDays(s.ex.date,-3);if(e<w)e=w;if(e<t)e=t}
    return e;
  }
  const endDay=addDays(exams[exams.length-1].date,-1);
  /* steps per day: enough to finish each exam's steps before it, spread evenly */
  let cum=0,perDay=0;
  exams.forEach(e=>{cum+=st.filter(s=>s.ex.id===e.id).reduce((a,s)=>a+(4-s.next),0);const days=Math.max(1,diffDays(t,e.date));perDay=Math.max(perDay,Math.ceil(cum/days))});
  if(cum)perDay=Math.max(2,perDay);
  res.perDay=perDay;
  const doneToday=blk.items.reduce((sum,it)=>{const p=prog(blk,it.id);return sum+STAGES.filter(s=>p[s]===t).reduce((a,s)=>a+durOf(it,s),0)},0);
  for(let d=t;d<=endDay;d=addDays(d,1)){
    let cap=perDay;if(d===t)cap=Math.max(0,cap-doneToday);
    const day={date:d,cap:perDay,used:d===t?doneToday:0,tasks:[],free:isFreeDay(blk,d),exams:blk.exams.filter(e=>e.date===d)};
    let left=cap;
    for(let guard=0;guard<400;guard++){
      const ready=st.filter(s=>s.next<4&&s.earliest<=d&&d<=s.lastDay);
      if(!ready.length)break;
      ready.sort((a,b)=>a.ex.date.localeCompare(b.ex.date)||a.next-b.next||b.w-a.w||(a.it.date+a.it.time).localeCompare(b.it.date+b.it.time));
      const pick=left>=1?ready[0]:null;
      if(!pick)break;
      const sk=STAGES[pick.next],m=durOf(pick.it,sk);
      day.tasks.push({id:pick.it.id,s:sk,min:m,ex:pick.ex.id});
      left-=m;day.used+=m;
      pick.next++;pick.placed=d;
      if(pick.next<4)pick.earliest=earliestFor(pick,d,t);
    }
    day.left=left;
    res.days.push(day);
  }
  /* second pass: squeeze leftovers into any open time before their exam, ignoring ideal spacing */
  st.filter(s=>s.next<4).sort((a,b)=>a.ex.date.localeCompare(b.ex.date)||a.next-b.next).forEach(s=>{
    while(s.next<4){
      const sk=STAGES[s.next],m=durOf(s.it,sk);
      const from=[s.placed||t,s.it.date,t].sort().pop();
      const cands=res.days.filter(d=>d.date>=from&&d.date<=s.lastDay);
      if(!cands.length)break;
      const day=cands.reduce((x,y)=>y.left>x.left?y:x);
      day.tasks.push({id:s.it.id,s:sk,min:m,ex:s.ex.id});day.left-=m;day.used+=m;s.placed=day.date;s.next++;
    }
  });
  res.days.forEach(d=>d.tasks.sort((a,b)=>{const ea=res.exams.findIndex(e=>e.id===a.ex),eb=res.exams.findIndex(e=>e.id===b.ex);return ea-eb||a.s.localeCompare(b.s)}));
  for(const s of st){
    for(let k=s.next;k<4;k++){
      (res.overflow[s.ex.id]=res.overflow[s.ex.id]||[]).push({id:s.it.id,s:STAGES[k],min:durOf(s.it,STAGES[k])});
    }
  }
  planMemo={k:key,v:res};
  return res;
}

function starSvg(on,size){size=size||18;return `<svg class="star ${on?"on":""}" viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true"><path d="M12 2.8l2.8 5.7 6.3.9-4.6 4.4 1.1 6.2L12 17l-5.6 3 1.1-6.2L2.9 9.4l6.3-.9z"/></svg>`}
const quizStars=p=>p==null?0:p>=.9?3:p>=.75?2:p>=.5?1:0;
function starsRow(n,size){return `<span class="stars">${[0,1,2].map(i=>starSvg(i<n,size)).join("")}</span>`}
function totalStars(blk){
  const lec=blk?studyItems(blk).filter(i=>doneCount(blk,i.id)===4).length:0;
  return lec+S.banks.reduce((a,b)=>a+quizStars(b.best),0);
}
function taskRow(blk,tk,removable){
  const it=blk.items.find(i=>i.id===tk.id);if(!it)return"";
  const done=!!prog(blk,it.id)[tk.s];
  return `<div class="row ${done?"done":""}">
    <button class="tick" data-act="stage" data-id="${it.id}" data-s="${tk.s}" aria-label="${done?"Mark not done":"Mark done"}: ${STAGE_NAME[tk.s]} ${esc(it.code)}">${I.check}</button>
    <button class="rowtext" data-act="item" data-id="${it.id}">
      <span class="tt">${esc(it.title)}</span>
      <span class="tm">${emo(it.subject)} <span style="color:${subjMeta(it.subject).color};font-weight:700">${esc(it.subject)}</span> · ${esc(it.code)} · ${STAGE_NAME[tk.s]}</span>
    </button>
    ${removable?`<button class="unplan" data-act="unplan" data-id="${it.id}" data-s="${tk.s}" aria-label="Remove from today's plan">${I.x}</button>`:""}
  </div>`;
}
function classesOn(blk,d){
  return [...blk.items.filter(i=>i.date===d).map(i=>({t:i.time,it:i,ev:false})),
    ...blk.events.filter(e=>e.date===d).map(e=>({t:e.time,label:e.label,ev:true}))].sort((a,b)=>(a.t||"99").localeCompare(b.t||"99"));
}
function classRow(c){
  if(c.ev)return `<div class="cls ev"><span class="ct">${c.t?fmtShort(c.t):""}</span><span class="cb">${esc(c.label)}</span></div>`;
  const it=c.it;
  return `<button class="cls" data-act="item" data-id="${it.id}"><span class="ct">${c.t?fmtShort(c.t):""}</span>${badge(it.subject,30)}<span class="cb"><span class="ctt">${esc(it.title)}</span><span class="tm">${esc(it.code)}${it.online?" · Online":""}${isQuiz(it)?' · <span class="qtag">Quiz</span>':""}</span></span></button>`;
}
function counters(blk){
  const t=today();const ups=blk.exams.filter(e=>e.date>=t).sort((a,b)=>a.date.localeCompare(b.date));
  if(!ups.length)return"";
  return `<div class="counters">${ups.slice(0,3).map((e,i)=>{const s=examStats(blk,e);const n=diffDays(t,e.date);
    return `<button class="counter ${i===0?"first":""}" data-act="examdetail" data-id="${e.id}">
      <span class="cn tnum">${n===0?"Today":n}</span><span class="cl">${n===0?"":n===1?"day · ":"days · "}${esc(e.name)}</span>
      <span class="cbar"><b style="width:${(s.pct*100).toFixed(1)}%"></b></span></button>`}).join("")}</div>`;
}
function todayView(blk){
  const t=today(),d0=parse(t),plan=buildPlan(blk);
  const day=plan.days.find(d=>d.date===t);
  const tasks=day?day.tasks:[];
  const doneToday=[];for(const it of studyItems(blk)){const p=prog(blk,it.id);STAGES.forEach(s=>{if(p[s]===t)doneToday.push({id:it.id,s})})}
  const total=tasks.length+doneToday.length;
  const cls=classesOn(blk,t);
  const soon=blk.items.filter(i=>isQuiz(i)&&i.date>=t&&diffDays(t,i.date)<=2);
  const mine=S.settings.planMode==="mine";
  const myTasks=((S.myPlan||{})[t]||[]).filter(x=>blk.items.some(i=>i.id===x.id));
  const myDone=myTasks.filter(x=>prog(blk,x.id)[x.s]).length;
  return `
  <header class="head"><div><div class="eyebrow">${WD[d0.getDay()]}</div><h1>${d0.getDate()} ${MONTHS[d0.getMonth()]}</h1><p class="basmala" dir="rtl" lang="ar">بسم الله، توكلت على الله</p></div>
    <button class="starchip" data-act="stars" aria-label="Your stars">${starSvg(true,16)}<span class="tnum">${totalStars(blk)}</span></button>
    <button class="iconbtn" data-act="go" data-v="settings" aria-label="Settings">${I.gear}</button></header>
  ${counters(blk)}
  ${soon.map(q=>`<div class="quizsoon">${I.quiz}<span><strong>Quiz ${diffDays(t,q.date)===0?"today":diffDays(t,q.date)===1?"tomorrow":"on "+WDS[parse(q.date).getDay()]}</strong> · ${esc(q.code)} ${esc(q.title)}${q.time?" · "+fmtShort(q.time):""}</span></div>`).join("")}
  <section>
    <div class="label">Study today ${mine?`<span class="tnum">${myTasks.length?`${myDone}/${myTasks.length} done`:""}</span>`:`<span class="tnum">${total?`${doneToday.length}/${total} done`:""}</span>`}</div>
    <div class="seg" style="margin-bottom:12px"><button class="${mine?"":"on"}" data-act="planmode" data-v="suggested">Suggested plan</button><button class="${mine?"on":""}" data-act="planmode" data-v="mine">My plan</button></div>
    ${mine?`
      ${myTasks.length?`<div class="daybar"><b style="width:${(myDone/myTasks.length*100).toFixed(1)}%"></b></div><div class="list">${myTasks.map(tk=>taskRow(blk,tk,true)).join("")}</div>`:`<p class="empty">Pick the lectures you want to get through today.</p>`}
      ${myTasks.length&&myDone===myTasks.length?`<div class="cheer">${starSvg(true,22)} You did everything you planned. Great work!</div>`:""}
      <button class="btn soft" style="width:100%;margin-top:10px" data-act="planpick">${I.plus} Add lectures to today</button>`
    :`
    ${total?`<div class="daybar"><b style="width:${(doneToday.length/total*100).toFixed(1)}%"></b></div>`:""}
    ${total?`<div class="list">${tasks.map(tk=>taskRow(blk,tk)).join("")}${doneToday.map(tk=>taskRow(blk,tk)).join("")}</div>`:`<p class="empty">${plan.exams.length?"Nothing to study today.":"No upcoming exams."}</p>`}
    ${!tasks.length&&doneToday.length?`<div class="cheer">${starSvg(true,22)} Today's study is done. Great work!</div>`:""}
    ${plan.exams.length?`<button class="link" data-act="go" data-v="plan">See the whole plan ${I.chev}</button>`:""}`}
  </section>
  ${cls.length?`<section><div class="label">Classes today</div><div class="list">${cls.map(classRow).join("")}</div></section>`:""}
  ${credit}`;
}
function planView(blk){
  const plan=buildPlan(blk),t=today();
  return `
  <header class="head"><button class="back" data-act="go" data-v="today">${I.back}Today</button></header>
  <h1>Study plan</h1>
  <p class="note">${plan.perDay?`About ${plan.perDay} steps a day gets you through everything before your exams. `:""}It updates itself every day, so anything you miss moves to the next days.</p>
  ${plan.days.map((d,i)=>{const dd=parse(d.date);
    const openDay=UI.openDays.has(d.date)||(i<1&&!UI.closedDays.has(d.date));
    const exams=d.exams.map(e=>`<div class="examrow">${esc(e.name)}${e.time?" · "+fmtShort(e.time):""}</div>`).join("");
    return `<section class="day" id="d-${d.date}">
      <button class="dayt" data-act="toggleday" data-d="${d.date}" data-open="${openDay}" aria-expanded="${openDay}">
        <span class="dn">${d.date===t?"Today":WDS[dd.getDay()]+" "+dd.getDate()+" "+MON[dd.getMonth()]}</span>
        <span class="ds">${d.tasks.length?`${d.tasks.length} step${d.tasks.length===1?"":"s"}`:"Free"}</span>
        <span class="chev ${openDay?"open":""}">${I.chev}</span></button>
      ${exams}
      ${openDay&&d.tasks.length?`<div class="list">${d.tasks.map(tk=>taskRow(blk,tk)).join("")}</div>`:""}

/* calendar */
function calView(blk){
  const t=today();
  if(!UI.calMonth)UI.calMonth=t.slice(0,7);
  if(!UI.calDay)UI.calDay=t;
  const [y,m]=UI.calMonth.split("-").map(Number);
  const first=new Date(y,m-1,1),days=new Date(y,m,0).getDate();
  const plan=buildPlan(blk);
  let cells="";
  for(let i=0;i<first.getDay();i++)cells+=`<span class="cc blank"></span>`;
  for(let dd=1;dd<=days;dd++){
    const k=`${y}-${pad(m)}-${pad(dd)}`;
    const its=blk.items.filter(i=>i.date===k);
    const lecs=its.filter(i=>!isQuiz(i)),qz=its.filter(isQuiz);
    const ex=blk.exams.filter(e=>e.date===k);
    const free=blk.free.includes(k);
    const cls=["cc",k===t?"today":"",k===UI.calDay?"sel":"",ex.length?"exam":"",free&&!ex.length?"free":""].join(" ");
    cells+=`<button class="${cls}" data-act="calday" data-d="${k}" aria-label="${dd} ${MONTHS[m-1]}${ex.length?", "+ex.map(e=>e.name).join(", ")+" exam":""}${qz.length?", quiz":""}">
      <span class="cd tnum">${dd}</span>
      ${ex.length?`<span class="cx">${esc(ex[0].name.length>5?ex[0].name.slice(0,3):ex[0].name)}</span>`:`<span class="dots">${lecs.slice(0,4).map(()=>"<i></i>").join("")}${qz.length?'<i class="qd"></i>':""}</span>`}
    </button>`;
  }
  const sel=UI.calDay;const sd=parse(sel);
  const cls=classesOn(blk,sel);const exs=blk.exams.filter(e=>e.date===sel);
  const pday=plan.days.find(d=>d.date===sel);
  return `
  <header class="head"><div><h1>Calendar</h1></div></header>
  <div class="calnav"><button class="iconbtn" data-act="calmonth" data-d="-1" aria-label="Previous month">${I.back}</button><strong>${MONTHS[m-1]} ${y}</strong><button class="iconbtn" data-act="calmonth" data-d="1" aria-label="Next month">${I.chev}</button></div>
  <div class="calgrid">${["S","M","T","W","T","F","S"].map(w=>`<span class="cw">${w}</span>`).join("")}${cells}</div>
  <div class="legend"><span><i class="ld"></i>Lecture</span><span><i class="qd"></i>Quiz</span><span><i class="exsw"></i>Exam</span><span><i class="frsw"></i>Free day</span></div>
  <section>
    <div class="label">${sel===t?"Today":WD[sd.getDay()]+" "+sd.getDate()+" "+MON[sd.getMonth()]}${blk.free.includes(sel)?' <span>Free day</span>':""}</div>
    ${exs.map(e=>`<div class="examrow">${esc(e.name)} exam${e.time?" · "+fmtShort(e.time):""}</div>`).join("")}
    ${cls.length?`<div class="list">${cls.map(classRow).join("")}</div>`:exs.length?"":`<p class="empty">No classes this day.</p>`}
  </section>
  ${S.settings.planMode==="mine"?(((S.myPlan||{})[sel]||[]).length?`<section><div class="label">My plan <span>${S.myPlan[sel].length} steps</span></div><div class="list">${S.myPlan[sel].map(tk=>taskRow(blk,tk)).join("")}</div></section>`:"")
   :(pday&&pday.tasks.length?`<section><div class="label">Suggested plan <span>${pday.tasks.length} steps</span></div><div class="list">${pday.tasks.map(tk=>taskRow(blk,tk)).join("")}</div></section>`:"")}`;
}

/* lectures */
function segLine(blk,it){
  const p=prog(blk,it.id);
  return `<span class="seg4">${STAGES.map(s=>`<i class="${p[s]?"on":""}"></i>`).join("")}</span>`;
}
function stepRing(n){
  if(n===4)return `<span class="donestar">${starSvg(true,26)}</span>`;
  const r=15,c=2*Math.PI*r,seg=c/4,gap=3;
  let arcs="";for(let k=0;k<4;k++)arcs+=`<circle cx="20" cy="20" r="${r}" style="fill:none;stroke:${k<n?"var(--accent)":"var(--line)"}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(seg-gap).toFixed(2)} ${(c-seg+gap).toFixed(2)}" stroke-dashoffset="${(-k*seg).toFixed(2)}" transform="rotate(-90 20 20)"/>`;
  return `<svg viewBox="0 0 40 40" width="42" height="42" aria-hidden="true">${arcs}<text x="20" y="24.5" text-anchor="middle" style="fill:var(--muted);font:700 11px var(--body)">${n}/4</text></svg>`;
}
function lecBanks(id){return S.banks.filter(b=>b.lec===id)}
function progLine(n){return `<div class="lline ${n===4?"full":""}"><span class="bars4">${[0,1,2,3].map(k=>`<i class="${k<n?"on":""}"></i>`).join("")}</span><span class="ln">${n}/4</span></div>`}
function lecRow(blk,it){
  const t=today();const p=prog(blk,it.id);const n=doneCount(blk,it.id);
  const nxt=STAGES.find(s=>!p[s]);const link=(blk.links||{})[it.id];const qb=lecBanks(it.id);
  return `<div class="lrow2 ${it.date>t?"later":""}">
    <span class="lemo" aria-hidden="true">${subjMeta(it.subject).icon}</span>
    <div class="lbody">
      <button class="lhead" data-act="item" data-id="${it.id}"><span class="tt"><span class="lcode">${esc(it.code)}</span> ${esc(it.title)}</span>
        <span class="lmeta">${spill(it.subject)}${it.date>t?`<span class="tm">Class on ${shortDate(it.date)}</span>`:""}</span></button>
      ${progLine(n)}
      <div class="lacts">
        ${n<4?`<button class="nextbtn" data-act="next" data-id="${it.id}">✅ ${STAGE_NAME[nxt]}</button>`:`<span class="alldone">⭐ All 4 steps done</span>`}
        <span class="licons">
        ${qb.length?`<button class="lfile qz" data-act="bank" data-id="${qb[0].id}" aria-label="Lecture quiz">📝</button>`:""}
        ${link?`<a class="lfile on" href="${esc(link)}" target="_blank" rel="noopener" aria-label="Open lecture file">📄</a>`:`<button class="lfile" data-act="item" data-id="${it.id}" aria-label="No file linked yet">📄</button>`}
        </span>
      </div>
    </div>
  </div>`;
}
function stepsPanel(blk,its){
  const t=today();const s=UI.stepSel||"s1";
  const cnt=x=>its.filter(i=>prog(blk,i.id)[x]).length;
  const done=its.filter(i=>prog(blk,i.id)[s]);const not=its.filter(i=>!prog(blk,i.id)[s]);
  const given=not.filter(i=>i.date<=t),later=not.filter(i=>i.date>t);
  const row=(i,ok)=>{const d=prog(blk,i.id)[s];return `<button class="srow ${ok?"ok":i.date>t?"later":""}" data-act="item" data-id="${i.id}"><span class="lemo" aria-hidden="true">${subjMeta(i.subject).icon}</span><span class="tx"><span class="tt"><span class="lcode">${esc(i.code)}</span> ${esc(i.title)}</span><span>${spill(i.subject)}</span></span><span class="when">${ok?"✅ "+shortDate(d):i.date>t?shortDate(i.date):"Not yet"}</span></button>`};
  return `<div class="stepseg">${STAGES.map(x=>`<button class="${s===x?"on":""}" data-act="stepsel" data-v="${x}"><b>${STAGE_NAME[x]}</b><span>${cnt(x)} / ${its.length} done</span></button>`).join("")}</div>
  <div class="lsum"><span>${STAGE_NAME[s]}: ${done.length} of ${its.length} lectures</span><span class="tnum">${its.length?Math.round(done.length/its.length*100):0}%</span></div><div class="sbar"><b style="width:${its.length?(done.length/its.length*100).toFixed(1):0}%"></b></div>
  <section><div class="label">Done <span>${done.length}</span></div>${done.length?`<div class="list">${done.map(i=>row(i,true)).join("")}</div>`:`<p class="empty">Nothing yet for ${STAGE_NAME[s].toLowerCase()}.</p>`}</section>
  ${given.length?`<section><div class="label">Not yet <span>${given.length}</span></div><div class="list">${given.map(i=>row(i,false)).join("")}</div></section>`:""}
  ${later.length?`<section><div class="label">Classes still to come <span>${later.length}</span></div><div class="list">${later.map(i=>row(i,false)).join("")}</div></section>`:""}`;
}
function filteredItems(blk){
  const all=studyItems(blk);
  if(UI.lecExam==="all")return all;
  const ex=blk.exams.find(e=>e.id===UI.lecExam);if(!ex){UI.lecExam="all";return all}
  const m=members(blk)[ex.id];return all.filter(i=>m.has(i.id));
}

  ${bulk?`<div class="bulk"><strong>Which step did you already finish?</strong>

      <p class="note">Marks ${STAGE_NAME[bulk].toLowerCase()} done for the ${eligible.length} lecture${eligible.length===1?"":"s"} below that were already given.</p>
      <div class="btns"><button class="btn soft" data-act="bulkcancel">Cancel</button><button class="btn primary" data-act="bulkapply">Mark done</button></div></div>`:""}
  ${UI.lecHint?`<div class="hint"><span>Tap the ✅ button to finish the next step. The line under it shows your progress, and all 4 steps earn a star.</span><button class="x" data-act="hidehint" aria-label="Hide tip">${I.x}</button></div>`:""}

function ring(p,size,stroke){
  size=size||84;stroke=stroke||9;const r=size/2-stroke/2-1,c=2*Math.PI*r;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" style="fill:none;stroke:var(--surface-2)" stroke-width="${stroke}"/>
    <circle class="ringfill" cx="${size/2}" cy="${size/2}" r="${r}" style="fill:none;stroke:var(--accent);--c:${c.toFixed(2)}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c*(1-p)).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}
function examDetailSheet(blk,sh){
  const ex=blk.exams.find(e=>e.id===sh.id);if(!ex)return"";
  const s=examStats(blk,ex);const left=diffDays(today(),ex.date);
  const subs={};s.items.forEach(i=>{const x=subs[i.subject]=subs[i.subject]||{n:0,d:0};x.n++;x.d+=doneCount(blk,i.id)});
  return `<div class="sheet-h"><h2>${esc(ex.name)}</h2><button class="x" data-act="close" aria-label="Close">${I.x}</button></div>
  <section class="hero"><span class="ringwrap">${ring(s.pct,92,10)}</span><div class="meta"><div class="num">${Math.round(s.pct*100)}%</div><span class="sub">${left>=0?countdownText(ex)+" · ":""}${shortDate(ex.date)}${ex.time?" · "+fmtShort(ex.time):""}</span></div></section>
  <div class="stats">
    <div class="stat"><b>${s.behind}</b><span>Not studied yet</span></div>
    <div class="stat"><b>${starSvg(true,20)} ${s.full}/${s.n}</b><span>Lectures finished</span></div>
  </div>
  <section><div class="label">Steps</div><div class="bars">${STAGES.map(x=>`<div class="bar-row"><span class="n">${STAGE_NAME[x]}</span><span class="v">${s.st[x]}/${s.n}</span><div class="track"><b style="width:${s.n?(s.st[x]/s.n*100).toFixed(1):0}%"></b></div></div>`).join("")}</div></section>
  <section><div class="label">Subjects</div><div class="bars">${Object.keys(subs).sort((a,b)=>subs[b].n-subs[a].n).map(k=>{const x=subs[k];return `<div class="bar-row"><span class="n">${emo(k)} ${esc(k)}</span><span class="v">${Math.round(x.d/(x.n*4)*100)}%</span><div class="track"><b style="width:${(x.d/(x.n*4)*100).toFixed(1)}%"></b></div></div>`}).join("")||'<p class="empty">No lectures in this exam yet.</p>'}</div></section>
  <div class="btns"><button class="btn soft" data-act="examlecs" data-id="${ex.id}">See its lectures</button><button class="btn soft" data-act="exam" data-id="${ex.id}">Edit exam</button></div>`;
}

/* quizzes */
const BATCHES=["11","10","9","8","Mixed"];
const batchLabel=b=>!b?"":b==="Mixed"?"Mixed batches":/^\d+$/.test(b)?`Batch ${b}`:b;
function bankRow(b){

function qScored(q){return !!q.card||q.a!=null}
function qRight(q,ans){return q.card?ans===1:ans===q.a}
function playQ(P,i){const r=P.qs[i];const b=S.banks.find(x=>x.id===r.b);return b?b.questions[r.i]:null}
function playView(){
  const P=UI.play;if(!P)return"";
  if(P.done){
    const idx=P.qs.map((_,i)=>i).filter(i=>{const q=playQ(P,i);return q&&qScored(q)});
    const right=idx.filter(i=>qRight(playQ(P,i),P.answers[i])).length;
    const pct=idx.length?right/idx.length:0;const st=quizStars(pct);
    const wrong=idx.filter(i=>!qRight(playQ(P,i),P.answers[i]));
    return `<header class="head"><button class="back" data-act="quitquiz">${I.back}Quizzes</button></header>
    <div class="result">
      <div class="bigstars">${[0,1,2].map(i=>`<span style="animation-delay:${.15+i*.22}s">${starSvg(i<st,54)}</span>`).join("")}</div>
      <div class="num tnum">${Math.round(pct*100)}%</div>
      <p class="sub">${right} of ${idx.length} right${P.qs.length>idx.length?` · ${P.qs.length-idx.length} without an answer key`:""}</p>
      <p class="cheerline">${pct>=.9?"Excellent!":pct>=.75?"Great job!":pct>=.5?"Good, keep going.":"Keep practising, you'll get there."}</p>
    </div>
    <div class="btns">${wrong.length?`<button class="btn primary" data-act="retrywrong">Retry ${wrong.length} wrong</button>`:""}<button class="btn soft" data-act="retryall">Start again</button></div>
    ${wrong.length?`<details class="fold"><summary>Review your ${wrong.length} mistake${wrong.length===1?"":"s"}</summary><div class="list" style="margin-top:8px">${wrong.map(i=>{const q=playQ(P,i);return `<div class="review"><div class="rq">${esc(q.q)}</div>${q.card?`<div class="ra good">${I.check} ${esc(q.card)}</div>`:`<div class="ra bad">${I.x} ${esc(q.o[P.answers[i]]||"–")}</div><div class="ra good">${I.check} ${esc(q.o[q.a])}</div>`}${q.e?`<div class="tm">${esc(q.e)}</div>`:""}</div>`}).join("")}</div></details>`:""}`;
  }
  const q=playQ(P,P.i);if(!q){UI.play=null;return""}
  const picked=P.answers[P.i];const answered=picked!=null;
  const top=`<div class="qtop"><button class="x" data-act="quitquiz" aria-label="Stop quiz">${I.x}</button><div class="qprog"><b style="width:${(P.i/P.qs.length*100).toFixed(1)}%"></b></div><span class="tnum qcount">${P.i+1}/${P.qs.length}</span></div>
  <div class="qcard"><div class="eyebrow">${esc(P.title)}${q.card?" · Recall":""}${q.rep>1?` · <span class="reptag">Repeated ×${q.rep}</span>`:""}</div><div class="qtext">${esc(q.q)}</div></div>`;
  const next=`<button class="btn primary nextq" data-act="nextq">${P.i+1<P.qs.length?"Next question":"See my score"}</button>`;
  if(q.card){
    const shown=P.revealed===P.i||answered;
    return top+(shown?`<div class="feedback ${answered?(picked===1?"good":"bad"):""}"><div class="eyebrow" style="margin-bottom:4px">Answer</div>${esc(q.card)}${q.e?`<div class="exp">${esc(q.e)}</div>`:""}</div>
      ${answered?next:`<div class="btns"><button class="btn soft" data-act="cardgrade" data-v="0">${I.x} I didn't know</button><button class="btn primary" data-act="cardgrade" data-v="1">${I.check} I knew it</button></div>`}`
      :`<p class="note">Think of your answer, then check it.</p><button class="btn primary" data-act="reveal">Show answer</button>`);
  }
  return top+`
  <div class="opts">${q.o.map((o,k)=>{let c="";if(answered){if(q.a==null)c=k===picked?"pickedn":"";else if(k===q.a)c="good";else if(k===picked)c="bad"}
    return `<button class="opt ${c}" data-act="pick" data-k="${k}" ${answered?"disabled":""}><span class="ol">${"ABCDEFGH"[k]}</span><span class="ot">${esc(o)}</span>${c==="good"?`<span class="oi">${I.check}</span>`:c==="bad"?`<span class="oi">${I.x}</span>`:""}</button>`}).join("")}</div>
  ${answered?`<div class="feedback ${q.a==null?"":picked===q.a?"good":"bad"}">${q.a==null?"No answer key for this question.":picked===q.a?"Correct!":`The answer is ${"ABCDEFGH"[q.a]}.`}${q.e?`<div class="exp">${esc(q.e)}</div>`:""}</div>${next}`:""}`;
}

function importSheet(blk,sh){
  const p=sh.parsed;const hasBlock=blk&&blk.items.length;
  const byType={};p.items.forEach(i=>byType[i.type]=(byType[i.type]||0)+1);
  const inRange=hasBlock&&p.range?blk.items.filter(i=>i.date>=p.range[0]&&i.date<=p.range[1]).length:0;
  if(!p.items.length)return `<div class="sheet-h"><h2>Couldn't read lectures</h2><button class="x" data-act="close" aria-label="Close">${I.x}</button></div>
    <p class="note">No lectures were found in ${esc(sh.name||"this file")}. In the Block tab, use Copy for Claude, send it to Claude with the PDF, then paste the reply.</p>${p.warnings.length?`<ul class="note">${p.warnings.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>`:""}
    <button class="btn primary" data-act="close">OK</button>`;
  return `<div class="sheet-h"><h2>${esc(p.name||"Timetable")}</h2><button class="x" data-act="close" aria-label="Close">${I.x}</button></div>
  <p class="note">${p.range?`${shortDate(p.range[0])} – ${shortDate(p.range[1])} · `:""}${Object.entries(byType).map(([k,v])=>`${v} ${TYPES.find(t=>t[0]===k)[1]}`).join(", ")}${p.free.length?` · ${p.free.length} free days`:""}</p>
  ${p.exams.length?`<div class="rows">${p.exams.map(e=>`<div class="rowb"><span class="rb"><strong>${esc(e.name)}</strong><small>${shortDate(e.date)}${e.time?" · "+fmt12(e.time):""}</small></span></div>`).join("")}</div>`:`<p class="note">No exam dates found. You can add them after.</p>`}
  ${p.warnings.length?`<div class="warn"><ul style="margin:0">${p.warnings.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>`:""}
  <details><summary style="cursor:pointer;font-weight:700;font-size:14px">Check the lectures</summary><div class="plist" style="margin-top:8px">${p.items.map(i=>`<div><span class="pd">${dm(i.date)} ${i.time}</span><span><strong>${esc(i.code)}</strong> ${esc(i.title)} <span class="sub">· ${esc(i.subject)}</span></span></div>`).join("")}</div></details>

      <button class="btn primary" data-act="doimport" data-v="update">Update ${esc(blk.name)}</button>

function includesText(blk,e){
  const types=e.types.filter(x=>x!=="Other").map(x=>TYPES.find(t=>t[0]===x)[1]).join(", ");
  if(e.mode==="pick")return "picked by hand";
  if(e.mode==="after"){const a=blk.exams.find(x=>x.id===e.after);return `${types} after ${a?esc(a.name):"…"}`}
  return `${types} before it`;
}

function renderSheet(){
  const sh=UI.sheet;
  if(!sh){sheetEl.innerHTML="";return}
  const blk=B();let h="";
  if(sh.type==="item")h=itemSheet(blk,sh);
  else if(sh.type==="examdetail")h=examDetailSheet(blk,sh);
  else if(sh.type==="bank")h=bankSheet(sh);
  else if(sh.type==="bankimport")h=bankImportSheet(sh);
  else if(sh.type==="pasteq")h=pasteQSheet(sh);
  else if(sh.type==="exam")h=examSheet(blk,sh);
  else if(sh.type==="import")h=importSheet(blk,sh);
  else if(sh.type==="paste")h=pasteSheet(sh);
  else if(sh.type==="wizard")h=wizardSheet(sh);
  else if(sh.type==="links")h=linksSheet(blk,sh);
  else if(sh.type==="planpick")h=planPickSheet(blk);

const BP_CHOICES={midterm:[["before","Everything before it"],["pick","I'll pick the lectures"]],final:[["after","Only what comes after the midterm"],["before","The whole block"]],practical:[["labs","Labs only"],["before","Everything before it"]],other:[["before","Everything before it"],["pick","I'll pick the lectures"]]};
function wizExams(sh){
  const list=[];
  for(const e of [...(sh.p?sh.p.exams:[]),...(sh.p2?sh.p2.exams:[])]){
    const k=e.kind+"|"+e.name.toLowerCase();const i=list.findIndex(x=>x.k===k);
    if(i>=0)list[i]={...list[i],date:e.date,time:e.time||list[i].time};else list.push({k,kind:e.kind,name:e.name,date:e.date,time:e.time});
  }
  return list.sort((a,b)=>a.date.localeCompare(b.date));
}

/* ---------- pdf ---------- */
let pdfjsP=null;
function loadPdfJs(){
  if(pdfjsP)return pdfjsP;
  const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  const add=src=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)});
  pdfjsP=add(base+"pdf.min.js").then(()=>add(base+"pdf.worker.min.js")).then(()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js";return window.pdfjsLib}).catch(e=>{pdfjsP=null;throw e});
  return pdfjsP;
}
async function readPdf(file){
  UI.sheet={type:"loading",name:file.name};renderSheet();
  try{
    const lib=await loadPdfJs();
    const data=new Uint8Array(await file.arrayBuffer());
    const doc=await lib.getDocument({data}).promise;
    const pages=[];
    for(let n=1;n<=doc.numPages;n++){
      const pg=await doc.getPage(n);const vp=pg.getViewport({scale:1});const tc=await pg.getTextContent();
      pages.push({height:vp.height,items:tc.items.filter(i=>"str" in i).map(i=>({str:i.str,x:i.transform[4],y:vp.height-i.transform[5],w:i.width,h:i.height}))});
    }
    const parsed=parseTimetable(pages);
    UI.sheet={type:"import",parsed,name:file.name};
  }catch(e){
    UI.sheet=null;UI.msg=pdfjsP===null?"Couldn't load the PDF reader. Check your internet and try again.":"Couldn't read that PDF. Try Copy for Claude and ask Claude instead.";
  }
  render();
}


/* ==== test bank parser (shared with app) ==== */
function pdfLinesFromPages(pages){
  /* pages: [{items:[{str,x,y,w,h}]}] top-down y; returns [{t,m:false}] */
  const out=[];
  for(const pg of pages){
    const its=pg.items.filter(i=>i.str&&i.str.trim()).sort((a,b)=>a.y-b.y||a.x-b.x);
    const lines=[];
    for(const it of its){const l=lines[lines.length-1];if(l&&Math.abs(it.y-l.y)<=2.5)l.items.push(it);else lines.push({y:it.y,items:[it]})}
    for(const l of lines){
      l.items.sort((a,b)=>a.x-b.x);let s="",end=null;

function parseQuestions(lines){
  const LET="ABCDEFGH";
  const clean=s=>String(s||"").replace(/[☀-➿️•●▪]/g," ").replace(/ /g," ").replace(/\s+/g," ").trim();
  const qRe=/^(?:Q(?:uestion)?\s*)?(\d{1,4})\s*[\.\)]\s*(.*)$/i;
  const oRe=/^[\(\[]?([A-Ha-h])\s*[\.\)\]]\s*(.+)$/;
  const ansRe=/^(?:correct\s+)?(?:answer|ans)\s*(?:is)?\s*[:\-–=]\s*[\(\[]?([A-Ha-h])\b[\.\)\]]?\s*(.*)$/i;
  const blankAns=/^(?:answer|ans)\s*[:\-–]?\s*_{3,}/i;
  const expRe=/^(?:explanation|rationale|reason|exp)\s*[:\-–]\s*(.*)$/i;
  const keyHead=/^(?:answer\s*key|answers?|key|model\s+answers?)\s*:?$/i;
  const qs=[];const key={};let cur=null,mode="q",keyMode=false,keyCur=null;
  const markRe=/\s*(\*|✓|✔|\(correct\))\s*$/i;
  for(const L of lines){
    const raw=typeof L==="string"?L:L.t;const marked=typeof L==="object"&&L.m;
    const rh=(String(raw).match(/\u2765/g)||[]).length,rf=(String(raw).match(/\u2766/g)||[]).length;
    const t=clean(raw);if(!t){if(cur&&mode==="q"&&!cur.o.length){cur.rh+=rh;cur.rf+=rf}continue}
    if(keyHead.test(t)){keyMode=true;keyCur=null;continue}
    if(keyMode){
      const pairs=[...t.matchAll(/(\d{1,4})\s*[\.\)\-:]\s*([A-Ha-h])\b(?![a-z])/g)];
      if(pairs.length>1&&t.length<pairs.length*14){pairs.forEach(p=>key[+p[1]]={l:p[2].toUpperCase(),txt:""});keyCur=null;continue}
      const m=t.match(/^(\d{1,4})\s*[\.\)\-:]\s*(.*)$/);
      if(m){const rest=m[2];const lm=rest.match(/^([A-Ha-h])\s*[\.\)]\s*(.*)$/)||rest.match(/^([A-Ha-h])$/);
        keyCur=key[+m[1]]={l:lm?lm[1].toUpperCase():null,txt:lm?(lm[2]||""):rest};continue}
      if(keyCur){keyCur.txt+=" "+t;continue}
      continue;
    }
    if(blankAns.test(t)){if(cur)cur.written=true;continue}
    let m;
    if(cur&&(m=t.match(ansRe))){cur.ansL=m[1].toUpperCase();if(m[2])cur.ansTxt=m[2];mode="e";continue}
    if(cur&&(m=t.match(expRe))){cur.e=(cur.e?cur.e+" ":"")+m[1];mode="e";continue}
    m=t.match(qRe);
    if(m&&(!cur||cur.o.length>=1||mode==="e"||cur.written||!cur.q||(cur.num!=null&&+m[1]===cur.num+1))){
      cur={num:+m[1],q:m[2]||"",o:[],marks:[],e:"",written:false,rh,rf};qs.push(cur);mode="q";
      /* options on the same line as the question */
      const inl=cur.q.split(/\s+(?=[A-Ha-h][\.\)]\s)/);
      if(inl.length>2&&/^[Aa][\.\)]\s/.test(inl[1])){cur.q=inl[0];inl.slice(1).forEach(s=>{const om=s.match(oRe);if(om)cur.o.push(om[2].trim())})}
      continue;
    }
    if(cur&&mode!=="e"&&(m=t.match(oRe))&&LET.indexOf(m[1].toUpperCase())===cur.o.length){
      let parts=t.split(/\s+(?=[A-Ha-h][\.\)]\s)/).map(s=>s.match(oRe)).filter(Boolean);
      for(const pm of parts){if(LET.indexOf(pm[1].toUpperCase())!==cur.o.length)break;let txt=pm[2].trim();let mk=marked;if(markRe.test(txt)){mk=true;txt=txt.replace(markRe,"")}cur.o.push(txt);if(mk)cur.marks.push(cur.o.length-1)}
      mode="o";continue;
    }
    if(!cur)continue;
    if(mode==="e")cur.e+=" "+t;
    else if(cur.o.length)cur.o[cur.o.length-1]+=" "+t;
    else{cur.q=(cur.q?cur.q+" ":"")+t;cur.rh+=rh;cur.rf+=rf}
  }
  const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  const out=[];let skipped=0;
  for(const c of qs){
    const k=key[c.num];
    let a=null,ansText="",e=c.e.trim();
    if(c.ansL!=null)a=LET.indexOf(c.ansL);
    else if(k&&k.l)a=LET.indexOf(k.l);
    else if(c.marks.length===1)a=c.marks[0];
    if(k){ansText=k.txt.trim();}
    if(c.ansTxt&&!ansText)ansText=c.ansTxt;
    const q=c.q.trim();if(!q){skipped++;continue}
    if(c.o.length>=2){
      if(a!=null&&a>=c.o.length)a=null;
      if(!e&&ansText&&a!=null){const extra=ansText.replace(c.o[a],"").replace(/^[\s\-–:,.]+/,"").trim();if(extra.length>3&&norm(ansText)!==norm(c.o[a]))e=ansText}
      if(a==null&&ansText&&!e)e="Answer key: "+ansText;
      out.push(Object.assign({q,o:c.o.map(s=>s.trim()),a,e},Math.max(c.rh,c.rf)>1?{rep:Math.max(c.rh,c.rf)}:{}));
    }else{
      /* recall / written question: show as a flashcard */
      let ans=ansText||(c.o.length===1?c.o[0]:"");
      if(k&&k.l&&c.o.length===1&&!ansText)ans=c.o[0];
      if(k&&k.l&&ansText&&c.o.length===1&&norm(ansText).indexOf(norm(c.o[0]))<0)ans=ansText;
      if(!ans){skipped++;continue}
      out.push(Object.assign({q,o:[],a:null,e,card:ans.trim()},Math.max(c.rh,c.rf)>1?{rep:Math.max(c.rh,c.rf)}:{}));
    }
  }
  return {questions:out,skipped};
}

async function docxLines(buf){
  const JSZip=await loadJSZip();const zip=await JSZip.loadAsync(buf);
  const xml=await zip.file("word/document.xml").async("string");
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  const W="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const out=[];let qn=0,on=0;
  for(const p of doc.getElementsByTagNameNS(W,"p")){
    let text="",marked=false;
    for(const r of p.getElementsByTagNameNS(W,"r")){
      const rpr=r.getElementsByTagNameNS(W,"rPr")[0];
      let runText="";for(const n of r.childNodes){if(n.localName==="t")runText+=n.textContent;else if(n.localName==="tab")runText+=" ";else if(n.localName==="br")runText+="\n"}
      if(rpr&&runText.trim()){
        const hl=rpr.getElementsByTagNameNS(W,"highlight")[0];const sh=rpr.getElementsByTagNameNS(W,"shd")[0];const col=rpr.getElementsByTagNameNS(W,"color")[0];const bo=rpr.getElementsByTagNameNS(W,"b")[0];
        if(hl&&hl.getAttributeNS(W,"val")!=="none")marked=true;
        if(sh){const f=(sh.getAttributeNS(W,"fill")||"").toLowerCase();if(f&&f!=="auto"&&f!=="ffffff")marked=true}
        if(col){const v=(col.getAttributeNS(W,"val")||"").toLowerCase();if(v&&v!=="auto"&&v!=="000000")marked=true}
        if(bo&&bo.getAttributeNS(W,"val")!=="0"&&bo.getAttributeNS(W,"val")!=="false")marked=true;
      }
      text+=runText;
    }
    const numPr=p.getElementsByTagNameNS(W,"numPr")[0];
    const parts=text.split("\n");
    if(numPr&&text.trim()&&!/^\s*(\d{1,4}[\.\)]|[A-Ha-h][\.\)])\s/.test(text)){
      const il=numPr.getElementsByTagNameNS(W,"ilvl")[0];const lvl=il?+il.getAttributeNS(W,"val"):0;
      if(lvl===0){qn++;on=0;parts[0]=`${qn}. ${parts[0]}`}else{parts[0]=`${"ABCDEFGH"[on++]||"H"}. ${parts[0]}`}
    }
    parts.forEach(t=>out.push({t,m:marked}));
  }
  return out;
}

function confetti(x,y,big){
  try{if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return}catch(e){}
  let cv=document.getElementById("fx");if(!cv)return;
  const dpr=window.devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
  const ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=["#4c8dff","#8fb8ff","#dbe6ff","#2f6fe0","#ffffff","#b26bff"];
  const n=big?140:36;const ps=[];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(big?5:3.2)*(0.5+Math.random());
    ps.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(big?5:3),r:big?4+Math.random()*4:3+Math.random()*2.5,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.3,star:i%5===0})}
  const t0=performance.now();const dur=big?1800:1000;
  cancelAnimationFrame(confetti.raf);
  (function step(t){const k=(t-t0)/dur;ctx.clearRect(0,0,innerWidth,innerHeight);
    if(k>=1)return;
    for(const p of ps){p.vy+=.18;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;ctx.save();ctx.globalAlpha=Math.max(0,1-k);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
      if(p.star){ctx.beginPath();for(let j=0;j<10;j++){const rr=j%2?p.r*.45:p.r*1.2;const aa=j*Math.PI/5;ctx.lineTo(Math.cos(aa)*rr,Math.sin(aa)*rr)}ctx.closePath();ctx.fill()}
      else ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()}
    confetti.raf=requestAnimationFrame(step)})(t0);
}

        const a=anns.find(x=>Math.min(bot,x.bot)-Math.max(top,x.top)>1);
        if(!a)continue;
        const c=(text.match(/^\s*(L|LAB)\s*\d{1,3}/i)||[])[0]||"";
        const title=text.replace(/^\s*(L|LAB)\s*\d{1,3}\s*[–\-:.)]*\s*/i,"").trim();
        const it=linkTarget(blk,title,/^lab/i.test(c)?"Lab":"",c.trim());
        if(it){blk.links[it.id]=a.url;ok++}else miss.push(c.trim()||title.slice(0,20));
      }
    }
    changed();
    UI.sheet=Object.assign(sh||{type:"links"},{result:{ok,miss},_shown:false});
  }catch(e){UI.sheet=Object.assign(sh||{type:"links"},{result:{ok:0,miss:[],err:true},_shown:false})}
  render();
}

  if(el.classList&&el.classList.contains("lecq")&&el.files&&el.files[0]){const f=el.files[0];el.value="";readBankFile(f,el.dataset.id,!!el.closest("#sheet"))}
  if(el.id==="bi-lec"&&UI.sheet&&UI.sheet.type==="bankimport"){const sh=UI.sheet;sh.lec=el.value;const L=sh.lec&&B()?B().items.find(i=>i.id===sh.lec):null;if(L){sh.subject=L.subject;sh.name=`${L.code} ${L.title}`;sh.batch=""}renderSheet()}
  if((el.id==="wiz-pdf"||el.id==="wiz-pdf2")&&el.files&&el.files[0]){
    const sh=UI.sheet;const f=el.files[0];el.value="";
    const back=sh;UI.sheet={type:"loading",name:f.name};renderSheet();
    try{const p=await parseTimetableFile(f);if(!p.items.length)throw 0;
      if(el.id==="wiz-pdf"){back.p=p;back.name=p.name||"New block";back.err=""}else back.p2=p}
    catch(err){back.err=pdfjsP===null?"Couldn't load the PDF reader. Check your internet and try again.":"Couldn't read lectures from that PDF. Try “PDF didn't work?” below."}
    back._shown=false;UI.sheet=back;renderSheet();
  }
  if(el.id==="block-file"&&el.files&&el.files[0]){
    const f=el.files[0];el.value="";
    try{const j=JSON.parse(await f.text());if(!j||j.app!=="study-block"||!j.block)throw 0;
      const same=findSameBlock(j.block);
      if(!S.blocks.length){const nb=applyBlockFile(j);UI.msg="";UI.view="today";render();showToast(`${nb.name} is ready`,null,null);renderToast();return}
      UI.confirm={t:"importblock",data:j,update:!!same,text:same?`Update ${same.name} with the shared file? New lectures, links and test banks are added. Your ticks and scores stay.`:`Add ${j.block.name} as a new block, with ${(j.banks||[]).length} test bank${(j.banks||[]).length===1?"":"s"}?`};UI.msg="";UI.view="settings";render();
    }catch(err){UI.msg="That file isn't a Study Tracker block.";render()}
  }
  if(el.id==="backup-file"&&el.files&&el.files[0]){
    const f=el.files[0];f.text().then(txt=>{
      try{const j=JSON.parse(txt);const v=j&&j.app==="study"?j.data:j;if(!v||!Array.isArray(v.blocks))throw 0;
        UI.confirm={t:"import",data:v,label:j.exported?dm(j.exported.slice(0,10))+" "+j.exported.slice(0,4):f.name};UI.msg=""}
      catch(err){UI.msg="That file isn't a Study Tracker backup.";UI.confirm=null}
      render();
    });el.value="";
  }
});
document.querySelector(".tabs").addEventListener("click",e=>{const t=e.target.closest("[data-tab]");if(!t)return;UI.sheet=null;go(t.dataset.tab)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&UI.sheet){UI.confirm=null;closeSheet()}});
let lastToday=today();
setInterval(()=>{const t=today();if(t!==lastToday){lastToday=t;softRender()}},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&today()!==lastToday){lastToday=today();softRender()}});

if(seeded||linksMigrated)changed();
UI.anim="anim";
render();
connect();
})();
</script>
